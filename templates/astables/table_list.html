<!DOCTYPE html>
<html>
<head>
    <title>Table List</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        function decodeHtml(html) {
            var txt = document.createElement("textarea");
            txt.innerHTML = html;
            return txt.value;
        }
    </script>
    <script>
        clickTable={}
        idxClickTable=0

        function fnLoadLinksTask(){
            // print the links
            var link="&lt;a href='/table_list/?models=";
            $(".dbtable .load_tablename ").each(function(i,el){
                var modelname=$(el).attr('modelname');
                //console.log(modelname)
                link+=modelname+','
            })
            link+="'>Link&lt;/a>";
            console.log(link);
            var encLink=link;
            var decLink=decodeHtml(encLink);
            $('#saveLink').html(decLink+encLink);
            
        }

        $(function() {
            $('body').on("click", ".load_tablename",function() {
                var table = $(this).attr('tablename');
                var model = $(this).attr('modelname');
                clickTable[idxClickTable++]=model;

                var url='/table_data/' + table + `?model=${model}`
                var limit=new URLSearchParams(window.location.search).get('limit');
                if(limit){
                    url+=`&limit=${limit}`;
                }

                $.get(url, function(data) {
                    var d=`
                    <div class="dbtable ${table}"  style="max-height: 20vh;overflow-y:scroll;">

                        <centers onclick="$(this).parent().remove();fnLoadLinksTask()" >
                            [ X ]
                        </centers>
                        <span class="open_tablename" tablename="${table}" modelname="${model}"><i>${ model }</i></span>
                        <span class="load_tablename" tablename="${table}" modelname="${model}">${ table }</span>
                        <centers onclick="fnMinTable(this)" >
                            [Min]
                        </centers>
                        <centers onclick="fnMaxTable(this)" >
                            [Max]
                        </centers>
                        <centers onclick="window.open('/?_P_PAGE_=testSeeds&errPause=${model}', '_blank')">
                            [Seed]
                        </centers>
                        <centers class="uiEmptyTable" onclick="fnEmptyTable({model:'${model}',table:'${table}'})">
                            [Empty]
                        </centers>
                        ${data}
                    </span>
                    <hr/>
                    `;
                    $('#table-datas').append(d);
                    $('#GENERATES').hide();

                    fnLoadLinksTask()
                });
            });

            $('.input_searchlist').on("input",function(e){
                var v = $(this).val()
                if(!v){
                    $('.listtablename').show();
                }

                $('.listtablename').show();
                $.each( $(".listtablename"), function(i, el){
                    var curr_name = $(el).attr('modelname').toLowerCase();
                    var words = v.toLowerCase().split(" ");

                    for (var i = 0; i < words.length; i++) {
                        if (curr_name.indexOf(words[i]) < 0) {
                            $(el).hide();
                            break;
                        }
                    }

                });
            });

            $('body').on("click", ".open_tablename",function(e) {
                if(false){
                    var tn=$(this).attr('tablename');
                    console.log(tn);
                    var beloc=tn.substring(8).toUpperCase();
                }
                var beloc=$(this).attr('modelname');
                //window.open(`/?_P_PAGE_=${beloc}/${beloc}.html`,'_blank')
                window.open(`/?modelLink=${beloc}`,'_blank')
                // maybe open on tabbed iframe, 
                // allow to close that iframe etc 
           })

           $('.open_admin').on("click", function(e){
                var model=$(this).attr('modelname');
                window.open(`/admin/ssApp/${model.toLowerCase()}/`,'_blank') 
           })

           // load models from the url bar
           $( new URLSearchParams(window.location.search).get('models')?.split(',') )?.each(function(ik,v){
                console.log(ik,v);
                setTimeout(
                    ()=>$(`.load_tablename[modelname="${v}"]`).trigger('click'),
                    ik * 100
                )
                
            })

           $('body').on("click", ".uiEmptyTables",function() {
                fnEmptyTables();
            });
        
        });

        function fnMaxTable(t){
            console.log('max')
            console.log( $(t).parent().css('max-height', '100vh') )
        }
        function fnMinTable(t){
            console.log('max')
            console.log( $(t).parent().css('max-height', '20vh') )
        }
        function fnSeedTable(t){
            console.log('max')
            console.log( $(t).parent().css('max-height', '20vh') )
        }
        function fnEmptyTable(args){
            console.log(args);
            var url=`/table_data/table?action=table_data_empty&model=${args.model}`;
            //window.open(url,'_blank');
            $.get(url, function(data){
                console.log(url, data)
            })
        }
        function fnEmptyTables(){
            $.each($('.uiEmptyTable'),function(i,v){
                console.log(v);
                $(v).trigger('click')
            })
        }

        
    </script>
</head>
<body>
    <style>
        .tablename:hover{
            text-decoration: underline;
        }
    </style>
    <!-- <h1>Table List</h1> -->

    <div style="max-width:100vw">
        <div id="saveLink" style="white-space: nowrap; text-overflow1:ellipsis; overflow: auto;max-width: 100%"></div>
    </div>

    <div style="display: flex; width: 100vw;">
        <span  style="width:25%; height: 90vh; overflow-y:scroll;" class="left_sidebar" >
            <input type="text" class="input_searchlist"  placeholder="search..."  />
            <input type="text" style="width:12px" class="input_searchwidth" oninput="$('.left_sidebar').css('width',$(this).val()+'%'); $('#table-datas').css('width',(100-$(this).val())+'%')" placeholder="w"/>
            <input type="button" style="width:12px" class="uiEmptyTables" onclick="fnEmptyTables" value="d"/>
            <ul id="table-list">
                {% for m in modelList %}
                    <li class="listtablename" tablename="{{m.table}}" modelname="{{m.model}}">
                        <small>
                            <span class="open_tablename tablename" tablename="{{m.table}}" modelname="{{m.model}}"><b>{{ m.model }}</b></span><br/>
                            <span class="load_tablename tablename " tablename="{{m.table}}" modelname="{{m.model}}">{{ m.table }}</span><br/>
                            <span class="open_admin tablename" tablename="{{m.table}}" modelname="{{m.model}}" style="text-transform: lowercase;">{{ m.model }}</span>
                        </small>
                    </li>
                {% endfor %}
            </ul>
        </span>
        <span id="table-datas" style="width:80%">
            <span id="GENERATES">
                <pre>{{jGENERATES}}</pre>
            </span>
        </span>
    </div>
</body>
</html>
